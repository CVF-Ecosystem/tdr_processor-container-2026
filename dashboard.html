<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>TIEN-TAN THUAN PORT — TDR Processor</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
    integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
    integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
    integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --bg0: #080C15;
      --bg1: #0D1320;
      --bg2: #121A2B;
      --bg3: #172033;
      --bg4: #1E293B;
      --bg5: #243045;
      --br: #1A2438;
      --br2: #243048;
      --br3: #2E3E55;
      --t1: #E8EFF8;
      --t2: #8FA3BC;
      --t3: #5A748F;
      --t4: #3D556E;
      --blue: #3B82F6;
      --green: #10B981;
      --amber: #F59E0B;
      --red: #EF4444;
      --purple: #8B5CF6;
      --cyan: #06B6D4;
      --pink: #EC4899;
      --teal: #14B8A6;
      --orange: #F97316;
      --sw: 196px;
      --swc: 50px;
      --hh: 44px;
      --mono: 'JetBrains Mono', ui-monospace, monospace
    }

    [data-theme="light"] {
      --bg0: #F1F5F9;
      --bg1: #FFFFFF;
      --bg2: #FFFFFF;
      --bg3: #F8FAFC;
      --bg4: #E2E8F0;
      --bg5: #CBD5E1;
      --br: #E2E8F0;
      --br2: #E2E8F0;
      --br3: #CBD5E1;
      --t1: #0F172A;
      --t2: #334155;
      --t3: #475569;
      --t4: #64748B
    }

    html,
    body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--bg0);
      color: var(--t1);
      overflow: hidden;
      font-size: 12px;
      -webkit-font-smoothing: antialiased
    }

    #root {
      width: 100%;
      height: 100vh;
      overflow: hidden
    }

    ::-webkit-scrollbar {
      width: 3px;
      height: 3px
    }

    ::-webkit-scrollbar-track {
      background: transparent
    }

    ::-webkit-scrollbar-thumb {
      background: var(--br3);
      border-radius: 2px
    }

    .sb {
      width: var(--sw);
      background: var(--bg1);
      border-right: 1px solid var(--br);
      display: flex;
      flex-direction: column;
      transition: width .2s;
      flex-shrink: 0;
      overflow: hidden
    }

    .sb.col {
      width: var(--swc)
    }

    .sb-head {
      height: var(--hh);
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 9px;
      border-bottom: 1px solid var(--br);
      flex-shrink: 0
    }

    .sb-filt {
      padding: 8px 8px 4px;
      border-top: 1px solid var(--br);
      flex-shrink: 0
    }

    .sb-filt-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 4px 8px;
      cursor: pointer
    }

    .sb-filt-title span {
      font-size: 8.5px;
      font-weight: 600;
      letter-spacing: 1.2px;
      color: var(--t4);
      text-transform: uppercase
    }

    .sb-filt-clr {
      font-size: 9.5px;
      font-weight: 600;
      color: var(--amber);
      cursor: pointer;
      padding: 2px 5px;
      border-radius: 4px;
      background: rgba(245, 158, 11, .1);
      border: none;
      font-family: 'Inter', sans-serif
    }

    .sb-filt-clr:hover {
      background: rgba(245, 158, 11, .2)
    }

    .sb-filt-field {
      margin-bottom: 7px
    }

    .sb-filt-lbl {
      font-size: 9px;
      color: var(--t4);
      font-weight: 500;
      display: block;
      margin-bottom: 4px;
      letter-spacing: .4px
    }

    .sb-filt-inp {
      width: 100%;
      background: var(--bg0);
      border: 1px solid var(--br2);
      color: var(--t1);
      font-size: 10.5px;
      padding: 5px 7px;
      border-radius: 5px;
      outline: none;
      font-family: 'Inter', sans-serif;
      transition: border-color .12s
    }

    .sb-filt-inp:focus {
      border-color: var(--blue)
    }

    .sb-filt-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px
    }

    .logo {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: linear-gradient(135deg, #3B82F6, #0EA5E9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 10px;
      color: #fff;
      flex-shrink: 0
    }

    .sb-brand h1 {
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap
    }

    .sb-brand p {
      font-size: 9.5px;
      color: var(--t4);
      margin-top: 1px;
      white-space: nowrap
    }

    .sb-nav {
      flex: 1;
      padding: 8px 6px;
      overflow-y: auto
    }

    .nav-sec {
      font-size: 8.5px;
      font-weight: 600;
      letter-spacing: 1.2px;
      color: var(--t4);
      text-transform: uppercase;
      padding: 8px 7px 3px
    }

    .nav-i {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: all .12s;
      margin-bottom: 1px;
      white-space: nowrap;
      user-select: none
    }

    .nav-i:hover {
      background: rgba(59, 130, 246, .08)
    }

    .nav-i.act {
      background: rgba(59, 130, 246, .14);
      color: var(--blue)
    }

    .ni {
      font-size: 13px;
      flex-shrink: 0;
      width: 18px;
      text-align: center
    }

    .nl {
      font-size: 11.5px;
      font-weight: 500
    }

    .nb {
      margin-left: auto;
      background: var(--red);
      color: #fff;
      font-size: 8px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 8px
    }

    .sb-foot {
      padding: 10px 12px;
      border-top: 1px solid var(--br)
    }

    .pulse::before {
      content: '';
      display: inline-block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--green);
      margin-right: 6px;
      animation: p 2s infinite
    }

    @keyframes p {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .3
      }
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0
    }

    .hdr {
      height: var(--hh);
      background: var(--bg1);
      border-bottom: 1px solid var(--br);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      flex-shrink: 0
    }

    .hdr-tog {
      width: 26px;
      height: 26px;
      border-radius: 5px;
      background: transparent;
      border: 1px solid var(--br2);
      color: var(--t3);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all .12s;
      flex-shrink: 0;
      font-size: 10px
    }

    .hdr-tog:hover {
      background: var(--bg4);
      color: var(--t1)
    }

    .hdr-t {
      flex: 1;
      min-width: 0
    }

    .hdr-t h2 {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .hdr-t p {
      font-size: 9.5px;
      color: var(--t4);
      margin-top: 1px
    }

    .hdr-filt {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg3);
      border: 1px solid var(--br2);
      border-radius: 6px;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 11px;
      color: var(--t3);
      white-space: nowrap;
      flex-shrink: 0
    }

    .hdr-filt:hover {
      border-color: var(--blue);
      color: var(--t1)
    }

    .hdr-act {
      display: flex;
      align-items: center;
      gap: 6px
    }

    .ic-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: var(--bg3);
      border: 1px solid var(--br2);
      color: var(--t3);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all .12s;
      position: relative;
      font-size: 13px
    }

    .ic-btn:hover {
      background: var(--bg5);
      color: var(--t1)
    }

    .nd {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 6px;
      height: 6px;
      background: var(--red);
      border-radius: 50%;
      border: 1.5px solid var(--bg1)
    }

    .ava {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: linear-gradient(135deg, #3B82F6, #8B5CF6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      cursor: pointer
    }

    .cnt {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .cnt>* {
      flex-shrink: 0;
      min-height: 0
    }

    .ph {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      padding: 2px 0
    }

    .ph h1 {
      font-size: 15px;
      font-weight: 700
    }

    .ph p {
      font-size: 10px;
      color: var(--t4);
      margin-top: 2px
    }

    .ph-r {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all .12s;
      white-space: nowrap;
      font-family: 'Inter', sans-serif
    }

    .bp {
      background: var(--blue);
      color: #fff
    }

    .bp:hover {
      background: #2563EB
    }

    .bg {
      background: transparent;
      color: var(--t3);
      border: 1px solid var(--br2)
    }

    .bg:hover {
      background: var(--bg4);
      color: var(--t1)
    }

    .br2x {
      background: rgba(239, 68, 68, .1);
      color: var(--red);
      border: 1px solid rgba(239, 68, 68, .2)
    }

    .br2x:hover {
      background: rgba(239, 68, 68, .18)
    }

    .kg {
      display: grid;
      gap: 8px;
      flex-shrink: 0
    }

    .k6 {
      grid-template-columns: repeat(6, 1fr)
    }

    .k4 {
      grid-template-columns: repeat(4, 1fr)
    }

    .k3 {
      grid-template-columns: repeat(3, 1fr)
    }

    .kc {
      background: var(--bg2);
      border: 1px solid var(--br2);
      border-radius: 8px;
      padding: 10px 12px;
      cursor: default;
      transition: border-color .15s, transform .15s;
      position: relative;
      overflow: hidden
    }

    .kc::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px
    }

    .kc:hover {
      border-color: var(--blue);
      transform: translateY(-1px)
    }

    .kc-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 7px
    }

    .kc-lbl {
      font-size: 9px;
      font-weight: 500;
      color: var(--t4);
      text-transform: uppercase;
      letter-spacing: .8px;
      line-height: 1.3
    }

    .kc-ico {
      width: 23px;
      height: 23px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px
    }

    .kc-val {
      font-size: 21px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 7px;
      letter-spacing: -.5px
    }

    .kc-val span {
      font-size: 11px;
      font-weight: 400;
      color: var(--t4);
      margin-left: 1px
    }

    .kc-bot {
      display: flex;
      align-items: center;
      justify-content: space-between
    }

    .kc-dl {
      font-size: 9.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 2px
    }

    .pos {
      color: var(--green)
    }

    .neg {
      color: var(--red)
    }

    .neu {
      color: var(--t4)
    }

    .card {
      background: var(--bg1);
      border: 1px solid var(--br2);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      flex-shrink: 0
    }

    .ch {
      padding: 9px 12px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--br);
      flex-shrink: 0
    }

    .ct {
      font-size: 11.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--t1)
    }

    .cdot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0
    }

    .cb {
      padding: 10px 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0
    }

    .g2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      flex-shrink: 0;
      min-height: 0
    }

    .g32 {
      display: grid;
      grid-template-columns: 3fr 2fr;
      gap: 8px;
      flex-shrink: 0;
      min-height: 0
    }

    .g23 {
      display: grid;
      grid-template-columns: 2fr 3fr;
      gap: 8px;
      flex-shrink: 0;
      min-height: 0
    }

    .gcol {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
      min-height: 0
    }

    .gcol>* {
      flex-shrink: 0;
      min-height: 0
    }

    .tabs {
      display: flex;
      gap: 2px;
      background: var(--bg4);
      border-radius: 6px;
      padding: 3px
    }

    .tab {
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 10.5px;
      font-weight: 500;
      color: var(--t3);
      cursor: pointer;
      transition: all .12s
    }

    .tab.ac {
      background: var(--bg2);
      color: var(--t1)
    }

    .bx {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 1px 7px;
      border-radius: 20px;
      font-size: 9.5px;
      font-weight: 600;
      white-space: nowrap
    }

    .bx::before {
      content: '';
      width: 4px;
      height: 4px;
      border-radius: 50%;
      flex-shrink: 0
    }

    .bg_ {
      background: rgba(16, 185, 129, .11);
      color: #10B981
    }

    .bg_::before {
      background: #10B981
    }

    .bb_ {
      background: rgba(59, 130, 246, .11);
      color: #3B82F6
    }

    .bb_::before {
      background: #3B82F6
    }

    .ba_ {
      background: rgba(245, 158, 11, .11);
      color: #F59E0B
    }

    .ba_::before {
      background: #F59E0B
    }

    .br_ {
      background: rgba(239, 68, 68, .11);
      color: #EF4444
    }

    .br_::before {
      background: #EF4444
    }

    .bp_ {
      background: rgba(139, 92, 246, .11);
      color: #8B5CF6
    }

    .bp_::before {
      background: #8B5CF6
    }

    .bc_ {
      background: rgba(6, 182, 212, .11);
      color: #06B6D4
    }

    .bc_::before {
      background: #06B6D4
    }

    .bs_ {
      background: rgba(90, 116, 143, .11);
      color: #5A748F
    }

    .bs_::before {
      background: #5A748F
    }

    .tw {
      overflow: auto;
      flex: 1;
      min-height: 0
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11.5px;
      letter-spacing: -0.1px
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 10px 12px;
      background: var(--bg2);
      color: var(--t4);
      font-weight: 700;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      text-align: left;
      white-space: nowrap;
      cursor: pointer;
      border-bottom: 2px solid var(--br2);
      user-select: none;
      transition: color .12s
    }

    thead th:hover {
      color: var(--t2)
    }

    thead th.sa::after {
      content: ' ↑';
      color: var(--blue)
    }

    thead th.sd::after {
      content: ' ↓';
      color: var(--blue)
    }

    tbody tr {
      border-bottom: 1px solid var(--br);
      transition: background-color .15s ease;
      background: var(--bg1)
    }

    tbody tr:hover {
      background-color: rgba(59, 130, 246, 0.04) !important
    }

    tbody tr:last-child {
      border-bottom: none
    }

    td {
      padding: 10px 12px;
      color: var(--t2);
      white-space: nowrap;
      vertical-align: middle
    }

    .tb {
      color: var(--t1);
      font-weight: 700
    }

    .tr {
      text-align: right
    }

    .tm {
      font-family: var(--mono);
      font-size: 10.5px
    }

    .kd {
      display: inline-flex;
      align-items: center;
      gap: 5px
    }

    .kd-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0
    }

    .pgr {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 7px 12px;
      border-top: 1px solid var(--br);
      flex-shrink: 0
    }

    .pgi {
      font-size: 10px;
      color: var(--t4);
      flex: 1
    }

    .pb {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      background: var(--bg3);
      border: 1px solid var(--br2);
      color: var(--t3);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 10px;
      transition: all .1s
    }

    .pb:hover {
      background: var(--bg5);
      color: var(--t1)
    }

    .pb.ac {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff
    }

    .pb:disabled {
      opacity: .3;
      cursor: default;
      pointer-events: none
    }

    .prg {
      height: 3px;
      background: var(--br2);
      border-radius: 2px;
      overflow: hidden
    }

    .prg-f {
      height: 100%;
      border-radius: 2px;
      transition: width .3s ease
    }

    .gnt-wrap {
      overflow-x: auto
    }

    .gnt-hdr {
      display: flex;
      align-items: center;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--br)
    }

    .gnt-lbl {
      flex-shrink: 0;
      font-size: 8.5px;
      font-weight: 600;
      letter-spacing: .8px;
      text-transform: uppercase;
      color: var(--t4)
    }

    .gnt-axis {
      flex: 1;
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      color: var(--t4);
      font-family: var(--mono)
    }

    .gnt-row {
      display: flex;
      align-items: center;
      padding: 4px 0;
      border-bottom: 1px solid rgba(20, 36, 56, .5)
    }

    .gnt-row:last-child {
      border-bottom: none
    }

    .gnt-rl {
      flex-shrink: 0;
      font-size: 10.5px;
      color: var(--t2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .gnt-trk {
      flex: 1;
      position: relative;
      height: 20px;
      background: rgba(8, 12, 21, .5);
      border-radius: 3px;
      overflow: hidden
    }

    .gnt-bar {
      position: absolute;
      top: 0;
      height: 100%;
      border-radius: 2px;
      display: flex;
      align-items: center;
      padding: 0 5px;
      font-size: 8.5px;
      font-weight: 600;
      color: rgba(255, 255, 255, .9);
      white-space: nowrap;
      overflow: hidden;
      cursor: pointer;
      opacity: .85;
      transition: opacity .12s
    }

    .gnt-bar:hover {
      opacity: 1;
      z-index: 2
    }

    .gnt-legs {
      display: flex;
      gap: 12px;
      padding-top: 8px;
      flex-wrap: wrap
    }

    .gnt-leg {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 9.5px;
      color: var(--t3)
    }

    .gnt-leg-dot {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      flex-shrink: 0
    }

    .bmap {
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .quay-line {
      height: 3px;
      border-radius: 1px;
      position: relative
    }

    .berths-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px
    }

    .berth-slot {
      border-radius: 6px;
      padding: 7px 8px;
      border-top-width: 3px;
      border-top-style: solid;
      border-left: 1px solid;
      border-right: 1px solid;
      border-bottom: 1px solid;
      min-height: 74px;
      transition: all .15s;
      cursor: default
    }

    .berth-slot:hover {
      filter: brightness(1.1)
    }

    .berth-id {
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: .7px;
      color: var(--t4);
      text-transform: uppercase;
      margin-bottom: 4px
    }

    .berth-vessel {
      font-size: 10px;
      font-weight: 600;
      color: var(--t1);
      line-height: 1.3;
      margin-bottom: 1px
    }

    .berth-op {
      font-size: 9px;
      color: var(--t3);
      margin-bottom: 5px
    }

    .berth-cranes {
      font-size: 10px;
      color: var(--cyan);
      letter-spacing: 1px;
      margin-bottom: 4px
    }

    .berth-avail {
      font-size: 9.5px;
      color: var(--t4);
      text-align: center;
      padding-top: 14px
    }

    .feed {
      flex-shrink: 0;
      border-top: 1px solid var(--br);
      background: var(--bg0);
      display: flex;
      flex-direction: column;
      transition: height .2s;
      overflow: hidden
    }

    .feed-hdr {
      height: 28px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
      cursor: pointer;
      flex-shrink: 0;
      user-select: none
    }

    .feed-body {
      flex: 1;
      overflow-y: auto;
      padding: 4px 12px 6px
    }

    .feed-title {
      font-size: 10.5px;
      font-weight: 500;
      color: var(--t3);
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px
    }

    .feed-line {
      display: flex;
      gap: 10px;
      padding: 2px 0;
      font-family: var(--mono);
      font-size: 10px;
      line-height: 1.7
    }

    .fl-t {
      color: var(--t4);
      flex-shrink: 0;
      width: 56px
    }

    .fl-lv {
      flex-shrink: 0;
      width: 52px;
      font-weight: 500
    }

    .fl-m {
      color: var(--t3)
    }

    @keyframes fadein {
      from {
        opacity: 0;
        transform: translateY(4px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .fl-new {
      animation: fadein .4s ease
    }

    .np {
      position: absolute;
      top: 50px;
      right: 12px;
      width: 290px;
      background: var(--bg3);
      border: 1px solid var(--br2);
      border-radius: 9px;
      z-index: 200;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .5)
    }

    .np-hd {
      padding: 10px 12px;
      border-bottom: 1px solid var(--br);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 600
    }

    .np-i {
      padding: 9px 12px;
      border-bottom: 1px solid rgba(20, 36, 56, .6);
      cursor: pointer;
      transition: background .1s
    }

    .np-i:hover {
      background: var(--bg4)
    }

    .np-i:last-child {
      border-bottom: none
    }

    .np-t {
      font-size: 11px;
      color: var(--t1);
      margin-bottom: 1px
    }

    .np-s {
      font-size: 9.5px;
      color: var(--t4)
    }

    .ms {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid rgba(20, 36, 56, .7)
    }

    .ms:last-child {
      border-bottom: none
    }

    .ms-l {
      font-size: 11px;
      color: var(--t2)
    }

    .ms-v {
      font-size: 12px;
      font-weight: 700
    }

    .dl-i {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 7px
    }

    .dl-dot {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      flex-shrink: 0
    }

    .dl-lbl {
      font-size: 10.5px;
      color: var(--t2);
      flex: 1
    }

    .dl-v {
      font-size: 11px;
      font-weight: 700;
      color: var(--t1)
    }

    .dl-p {
      font-size: 9.5px;
      color: var(--t4);
      width: 28px;
      text-align: right
    }

    .acc {
      border-radius: 8px;
      background: var(--bg2);
      border: 1px solid var(--br2);
      overflow: hidden;
      margin-bottom: 6px
    }

    .acc-hd {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      cursor: pointer;
      min-height: 52px;
      user-select: none
    }

    .acc-bd {
      padding: 0 12px 12px
    }

    .acc-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px
    }

    .acc-cell {
      background: var(--bg3);
      border-radius: 6px;
      padding: 8px 10px
    }

    .acc-cl {
      font-size: 8.5px;
      color: var(--t4);
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 3px
    }

    .acc-cv {
      font-size: 13px;
      font-weight: 600;
      color: var(--t1)
    }

    .kpi-strip {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      gap: 8px;
      padding: 8px 10px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none
    }

    .kpi-strip::-webkit-scrollbar {
      display: none
    }

    .kpi-strip .kc {
      min-width: 148px;
      scroll-snap-align: start;
      flex-shrink: 0
    }

    .m-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 58px;
      background: var(--bg1);
      border-top: 1px solid var(--br);
      display: flex;
      z-index: 200
    }

    .m-nav-i {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      padding: 4px 2px;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      min-height: 44px
    }

    .ld-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      color: var(--t3)
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .ld-spin {
      width: 28px;
      height: 28px;
      border: 2px solid var(--br2);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 1s linear infinite
    }

    @media(max-width:768px) {
      .sb {
        display: none !important
      }

      .hdr-filt,
      .hdr-tog {
        display: none !important
      }

      .g2,
      .g32,
      .g23 {
        grid-template-columns: 1fr !important
      }

      .k6 {
        grid-template-columns: repeat(2, 1fr) !important
      }

      .k4 {
        grid-template-columns: repeat(2, 1fr) !important
      }

      .cnt {
        padding: 0 !important
      }

      .card {
        border-left: none;
        border-right: none;
        border-radius: 0
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;
    const C = { blue: "#3B82F6", green: "#10B981", amber: "#F59E0B", red: "#EF4444", purple: "#8B5CF6", cyan: "#06B6D4", pink: "#EC4899", teal: "#14B8A6", orange: "#F97316" };
    let KPI_TARGET = 45;
    const SP0 = { v: [0, 0, 0, 0, 0, 0, 0, 0], t: [0, 0, 0, 0, 0, 0, 0, 0], ps: [0, 0, 0, 0, 0, 0, 0, 0], nw: [0, 0, 0, 0, 0, 0, 0, 0], nm: [0, 0, 0, 0, 0, 0, 0, 0], dl: [0, 0, 0, 0, 0, 0, 0, 0], de: [0, 0, 0, 0, 0, 0, 0, 0], dh: [0, 0, 0, 0, 0, 0, 0, 0] };

    function Spark({ data, color = "#3B82F6", w = 56, h = 22 }) {
      if (!data?.length) return null;
      const mn = Math.min(...data), mx = Math.max(...data), rng = mx - mn || 1;
      const pts = data.map((v, i) => `${(i / (data.length - 1)) * (w - 4) + 2},${h - ((v - mn) / rng) * (h - 4) - 2}`).join(" ");
      const lx = w - 2, lv = data[data.length - 1], ly = h - ((lv - mn) / rng) * (h - 4) - 2;
      return (<svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{ overflow: "visible" }}><polyline points={pts} fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round" /><circle cx={lx} cy={ly} r="2" fill={color} /></svg>);
    }

    function KpiCard({ lbl, val, unit, dl, dlt, icon, ic, spark }) {
      return (<div className="kc"><div className="kc-top"><div className="kc-lbl">{lbl}</div><div className="kc-ico" style={{ background: `${ic}18` }}><span style={{ color: ic, fontSize: 11 }}>{icon}</span></div></div><div className="kc-val">{val}{unit && <span>{unit}</span>}</div><div className="kc-bot"><div className={`kc-dl ${dlt}`}>{dlt === "pos" ? "↑" : dlt === "neg" ? "↓" : "→"} {dl}</div><Spark data={spark} color={ic} /></div></div>);
    }

    function Sbadge({ s }) { const m = { Completed: "bg_", Berthed: "bb_", Anchored: "ba_", Departed: "bs_" }; return <span className={`bx ${m[s] || "bs_"}`}>{s}</span>; }
    function Ebadge({ t }) { if (t === "Terminal Convenience") return <span className="bx br_">Terminal</span>; if (t === "Non-Terminal Convenience") return <span className="bx ba_">Non-Terminal</span>; return <span className="bx bp_">Force Majeure</span>; }
    function CCbadge({ cat }) { if (!cat) return null; const lower = cat.toLowerCase(); const n = parseInt((cat.match(/\d+/) || [])[0] || "0"); const cl = n === 1 ? "br_" : n === 2 ? "ba_" : n === 3 ? "bp_" : lower.includes("cran") || lower.includes("equip") ? "br_" : lower.includes("vessel") ? "ba_" : "bs_"; return <span className={`bx ${cl}`} style={{ fontFamily: "var(--mono)", fontSize: 8.5 }}>{cat.length > 10 ? cat.substring(0, 10) + "…" : cat}</span>; }
    function ErrCodeBadge({ code }) { const m = { d: { cl: "br_", lbl: "TC" }, i: { cl: "ba_", lbl: "NTC" }, m: { cl: "bp_", lbl: "FM" }, n: { cl: "ba_", lbl: "NTC" }, a: { cl: "br_", lbl: "TC" } }; const v = m[code] || { cl: "bs_", lbl: code || "—" }; return <span className={`bx ${v.cl}`} style={{ fontFamily: "var(--mono)", fontSize: 8 }}>{v.lbl}</span>; }

    function renderPageButtons(activePg, totalPgs, onSelect) {
      const range = [];
      const maxBtns = 7;
      let start = Math.max(0, activePg - 3);
      let end = Math.min(totalPgs - 1, start + maxBtns - 1);
      if (end - start < maxBtns - 1) {
        start = Math.max(0, end - maxBtns + 1);
      }
      for (let i = start; i <= end; i++) {
        range.push(<button key={i} className={`pb${i === activePg ? " ac" : ""}`} onClick={() => onSelect(i)}>{i + 1}</button>);
      }
      return range;
    }

    function VesselTable({ data, perPage = 20 }) {
      const [col, setCol] = useState("ata"); const [dir, setDir] = useState("desc"); const [pg, setPg] = useState(0);
      const sorted = useMemo(() => [...data].sort((a, b) => { let va = a[col], vb = b[col]; if (va == null) va = dir === "asc" ? Infinity : -Infinity; if (vb == null) vb = dir === "asc" ? Infinity : -Infinity; if (typeof va === "string") return dir === "asc" ? va.localeCompare(vb) : vb.localeCompare(va); return dir === "asc" ? va - vb : vb - va; }), [data, col, dir]);
      const rows = sorted.slice(pg * perPage, (pg + 1) * perPage); const pages = Math.ceil(data.length / perPage);
      const Th = ({ c, l, r }) => <th className={col === c ? (dir === "asc" ? "sa" : "sd") : ""} onClick={() => { if (col === c) setDir(d => d === "asc" ? "desc" : "asc"); else { setCol(c); setDir("asc"); } setPg(0); }} style={r ? { textAlign: "right" } : {}}>{l}</th>;
      return (<><div className="tw"><table><thead><tr><th style={{ width: 12 }}></th><Th c="name" l="Vessel" /><Th c="voyage" l="Voyage" /><Th c="op" l="Operator" /><Th c="berth" l="Berth" /><Th c="ata" l="ATB" r /><Th c="atd" l="ATD" r /><Th c="portstay" l="Portstay h" r /><Th c="net" l="Net Wk h" r /><Th c="cranes" l="Cranes" r /><Th c="ci" l="VMPH" r /><Th c="gmph" l="GMPH" r /><Th c="nmph" l="NMPH" r /><Th c="dis" l="Disch." r /><Th c="load" l="Load" r /><Th c="conts" l="Conts" r /><Th c="teus" l="TEUs" r /></tr></thead><tbody>{rows.map(v => (<tr key={v.id}><td style={{ padding: "5px 6px" }}><div style={{ width: 6, height: 6, borderRadius: "50%", background: v.nmph >= KPI_TARGET ? C.green : C.red }} /></td><td className="tb">{v.name}</td><td className="tm" style={{ color: "var(--t3)" }}>{v.voyage}</td><td>{v.op}</td><td><span className="tm" style={{ color: C.blue }}>{v.berth}</span></td><td className="tr tm">{v.ata || "—"}</td><td className="tr tm" style={{ color: "var(--t3)" }}>{v.atd || "—"}</td><td className="tr">{v.portstay != null ? v.portstay.toFixed(1) : "—"}</td><td className="tr">{v.net.toFixed(1)}</td><td className="tr">{v.cranes}</td><td className="tr" style={{ color: "var(--t3)" }}>{v.ci.toFixed(1)}</td><td className="tr">{v.gmph.toFixed(1)}</td><td className="tr"><div className="kd"><div className="kd-dot" style={{ background: v.nmph >= KPI_TARGET ? C.green : C.red }} /><span style={{ color: v.nmph >= KPI_TARGET ? C.green : C.red, fontWeight: 700 }}>{v.nmph.toFixed(1)}</span></div></td><td className="tr">{v.dis.toLocaleString()}</td><td className="tr">{v.load.toLocaleString()}</td><td className="tr tb">{v.conts.toLocaleString()}</td><td className="tr" style={{ color: "var(--t2)" }}>{v.teus.toLocaleString()}</td></tr>))}</tbody></table></div><div className="pgr"><span className="pgi">{pg * perPage + 1}–{Math.min((pg + 1) * perPage, data.length)} of {data.length} · <span style={{ color: C.green }}>{data.filter(v => v.nmph >= KPI_TARGET).length} above KPI</span> · <span style={{ color: C.red }}>{data.filter(v => v.nmph < KPI_TARGET).length} below</span></span><button className="pb" onClick={() => setPg(p => p - 1)} disabled={pg === 0}>‹</button>{renderPageButtons(pg, pages, setPg)}<button className="pb" onClick={() => setPg(p => p + 1)} disabled={pg >= pages - 1}>›</button></div></>);
    }

    function DelayTable({ data, perPage = 12 }) {
      const [col, setCol] = useState("dur"); const [dir, setDir] = useState("desc"); const [pg, setPg] = useState(0);
      const sorted = useMemo(() => [...data].sort((a, b) => { let va = a[col], vb = b[col]; if (va == null) va = dir === "asc" ? Infinity : -Infinity; if (vb == null) vb = dir === "asc" ? Infinity : -Infinity; if (typeof va === "string") return dir === "asc" ? va.localeCompare(vb) : vb.localeCompare(va); return dir === "asc" ? va - vb : vb - va; }), [data, col, dir]);
      const rows = sorted.slice(pg * perPage, (pg + 1) * perPage); const pages = Math.ceil(data.length / perPage);
      const Th = ({ c, l, r }) => <th className={col === c ? (dir === "asc" ? "sa" : "sd") : ""} onClick={() => { if (col === c) setDir(d => d === "asc" ? "desc" : "asc"); else { setCol(c); setDir("desc"); } setPg(0); }} style={r ? { textAlign: "right" } : {}}>{l}</th>;
      return (<><div className="tw"><table><thead><tr><Th c="vessel" l="Vessel" /><Th c="qc" l="QC" /><th>Stop</th><th>Code</th><Th c="from" l="From" /><Th c="to" l="To" /><Th c="dur" l="Dur h" r /><Th c="type" l="Type" /></tr></thead><tbody>{rows.map(d => (<tr key={d.id}><td className="tb" style={{ maxWidth: 130, overflow: "hidden", textOverflow: "ellipsis" }}>{d.vessel}</td><td><span className="bx bc_" style={{ fontFamily: "var(--mono)" }}>{d.qc}</span></td><td><CCbadge cat={d.cat} /></td><td><ErrCodeBadge code={d.code} /></td><td className="tm">{d.from}</td><td className="tm">{d.to}</td><td className="tr"><span style={{ color: d.dur >= 1 ? C.red : C.amber, fontWeight: 700 }}>{d.dur.toFixed(2)}h</span></td><td><Ebadge t={d.type} /></td></tr>))}</tbody></table></div><div className="pgr"><span className="pgi">{pg * perPage + 1}–{Math.min((pg + 1) * perPage, data.length)} of {data.length} · <span style={{ color: C.red }}>{data.filter(d => d.dur >= 1).length} critical</span> · <span style={{ color: C.amber }}>{data.filter(d => d.dur < 1).length} minor</span></span><button className="pb" onClick={() => setPg(p => p - 1)} disabled={pg === 0}>‹</button>{renderPageButtons(pg, pages, setPg)}<button className="pb" onClick={() => setPg(p => p + 1)} disabled={pg >= pages - 1}>›</button></div></>);
    }

    function QCGantt({ timeline }) {
      const W = 120; const toP = h => (h / 24) * 100;
      const vc = {}; timeline.forEach(r => r.segs.forEach(s => { vc[s.v] = s.col; }));
      return (<div className="gnt-wrap"><div className="gnt-hdr"><div className="gnt-lbl" style={{ width: W }}>QC Crane</div><div className="gnt-axis" style={{ paddingLeft: 8 }}>{[0, 4, 8, 12, 16, 20, 24].map(h => <span key={h}>{String(h).padStart(2, "0")}:00</span>)}</div></div>{timeline.map(row => (<div key={row.qc} className="gnt-row"><div className="gnt-rl" style={{ width: W }}><span className="bx bc_" style={{ fontFamily: "var(--mono)", fontSize: 9.5 }}>{row.qc}</span></div><div className="gnt-trk" style={{ marginLeft: 8 }}>{row.segs.map((seg, i) => { const l = toP(seg.from), w = Math.max(toP(seg.to) - l, .5); return (<div key={i} className="gnt-bar" style={{ left: `${l}%`, width: `${w}%`, background: `${seg.col}CC`, borderLeft: `2px solid ${seg.col}` }} title={`${row.qc}→${seg.v}`}>{w > 6 ? seg.v.split(" ")[0] : ""}</div>); })}</div></div>))}<div className="gnt-legs">{Object.entries(vc).map(([v, col]) => (<div key={v} className="gnt-leg"><div className="gnt-leg-dot" style={{ background: col }} />{v.split(" ").slice(0, 2).join(" ")}</div>))}</div></div>);
    }

    function DelayGantt({ data }) {
      const W = 120; const byV = useMemo(() => { const m = {}; data.forEach(d => { if (!m[d.vessel]) m[d.vessel] = []; m[d.vessel].push(d); }); return m; }, [data]);
      const ec = { d: C.red, i: C.amber, m: C.purple };
      const toP = t => {
        if (!t || t === "—") return 0;
        const timePart = t.includes(" ") ? t.split(" ")[1] : t;
        if (!timePart) return 0;
        const [h, m] = timePart.split(":").map(Number);
        return (isNaN(h) ? 0 : ((h + (m || 0) / 60) / 24) * 100);
      };
      return (<div className="gnt-wrap"><div className="gnt-hdr"><div className="gnt-lbl" style={{ width: W }}>Vessel</div><div className="gnt-axis" style={{ paddingLeft: 8 }}>{[0, 4, 8, 12, 16, 20, 24].map(h => <span key={h}>{String(h).padStart(2, "0")}:00</span>)}</div></div>{Object.entries(byV).map(([v, evs]) => (<div key={v} className="gnt-row"><div className="gnt-rl" style={{ width: W }} title={v}>{v.split(" ").slice(0, 2).join(" ")}</div><div className="gnt-trk" style={{ marginLeft: 8 }}>{evs.map((ev, i) => { const l = toP(ev.from), w = Math.max(toP(ev.to) - l, .5); return (<div key={i} className="gnt-bar" style={{ left: `${l}%`, width: `${w}%`, background: `${ec[ev.code] || C.red}CC`, borderLeft: `2px solid ${ec[ev.code] || C.red}` }} title={`${ev.rmk} ${ev.dur.toFixed(2)}h`}>{w > 5 ? ev.rmk.substring(0, 12) : ""}</div>); })}</div></div>))}<div className="gnt-legs">{[["d", C.red, "Terminal Conv."], ["i", C.amber, "Non-Terminal Conv."], ["m", C.purple, "Force Majeure"]].map(([c, col, lbl]) => (<div key={c} className="gnt-leg"><div className="gnt-leg-dot" style={{ background: col }} />{lbl}</div>))}</div></div>);
    }

    function BerthMap({ berths }) {
      const sc = { Berthed: C.blue, Available: "#1E293B", Anchored: C.amber };
      const sb = { Berthed: C.blue, Available: "#243048", Anchored: C.amber };

      // Better wave/water visualization
      const Waves = ({ color }) => (
        <svg width="100%" height="24" viewBox="0 0 120 24" preserveAspectRatio="none" style={{ opacity: 0.4 }}>
          <path d="M0,12 C20,8 40,16 60,12 C80,8 100,16 120,12 V24 H0 Z" fill={color} />

    function OpBarChart({ data, kt = 45, theme = "dark" }) {
      const ref = useRef(null); const ch = useRef(null);
      useEffect(() => {
        if (!ref.current) return;
        ch.current?.destroy();
        const ctx = ref.current.getContext("2d");

        const allVals = [...data.map(d => d.nmh), kt];
        const minV = Math.max(0, Math.floor(Math.min(...allVals) * 0.85));
        const maxV = Math.ceil(Math.max(...allVals) * 1.08);

        const isLight = theme === "light";
        const gridColor = isLight ? "rgba(226, 232, 240, 0.8)" : "rgba(20,36,56,.9)";
        const tickColor = isLight ? "#64748B" : "#3D556E";

        // Create gradients
        const greenGrad = ctx.createLinearGradient(0, 0, 0, 200);
        greenGrad.addColorStop(0, 'rgba(16,185,129,0.8)');
        greenGrad.addColorStop(1, 'rgba(16,185,129,0.2)');

        const redGrad = ctx.createLinearGradient(0, 0, 0, 200);
        redGrad.addColorStop(0, 'rgba(239,68,68,0.8)');
        redGrad.addColorStop(1, 'rgba(239,68,68,0.2)');

        const amberGrad = ctx.createLinearGradient(0, 0, 0, 200);
        amberGrad.addColorStop(0, 'rgba(245,158,11,0.8)');
        amberGrad.addColorStop(1, 'rgba(245,158,11,0.2)');

        const colors = data.map(d => {
          if (d.nmh >= kt) return greenGrad;
          if (d.nmh >= kt - 5) return amberGrad;
          return redGrad;
        });

        const borderColors = data.map(d => {
          if (d.nmh >= kt) return C.green;
          if (d.nmh >= kt - 5) return C.amber;
          return C.red;
        });

        ch.current = new Chart(ctx, {
          type: "bar",
          data: {
            labels: data.map(d => d.op),
            datasets: [{
              label: "Avg Net M/h",
              data: data.map(d => d.nmh),
              backgroundColor: colors,
              borderColor: borderColors,
              borderWidth: 1.5,
              borderRadius: 6,
              borderSkipped: false
            }, {
              label: `KPI (${kt})`,
              data: data.map(() => kt),
              type: "line",
              borderColor: C.blue,
              borderWidth: 2,
              borderDash: [6, 4],
              pointRadius: 0,
              fill: false,
              tension: 0
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: (ctx) => ` ${ctx.raw.toFixed(1)} M/h`
                }
              }
            },
            scales: {
              x: { grid: { display: false }, ticks: { color: tickColor, font: { size: 10, weight: 600 } } },
              y: { grid: { color: gridColor }, border: { dash: [3, 3] }, ticks: { color: tickColor, font: { size: 9 } }, min: minV, max: maxV }
            }
          }
        });
        return () => ch.current?.destroy();
      }, [data, kt, theme]);
      return <canvas ref={ref} />;
    }

          <div style={{ padding: '0 10px 8px' }}><div style={{ background: 'var(--bg2)', border: '1px solid var(--br2)', borderRadius: 8, padding: '12px' }}><DonutChart data={marketStats.cargo} theme={theme} customColors={{ "Discharge": C.blue, "Load": C.green, "Shifting": C.purple }} label="Moves" /></div></div>
          {sec(C.cyan, "Market Volume Trend")}
          <div style={{ padding: '0 10px 8px' }}><div style={{ background: 'var(--bg2)', border: '1px solid var(--br2)', borderRadius: 8, padding: '12px', height: 200 }}><MarketTrendChart data={marketStats.trends} theme={theme} /></div></div>
        </>}
        {nav === "containers" && <>
          <KpiStrip items={[{ lbl: "Full %", val: `${Math.round(marketStats.status.Full / (marketStats.status.Full + marketStats.status.Empty || 1) * 100)}%`, ic: C.purple, icon: "⚡", dl: "laden", dlt: "pos", spark: sp.t }, { lbl: "40' Ratio", val: `${Math.round(marketStats.size["40'"] / (Object.values(marketStats.size).reduce((a, b) => a + b, 0) || 1) * 100)}%`, ic: C.green, icon: "📏", dl: "large units", dlt: "pos", spark: sp.t }]} />
          {sec(C.purple, "Full vs Empty Status")}
          <div style={{ padding: '0 10px 8px' }}><div style={{ background: 'var(--bg2)', border: '1px solid var(--br2)', borderRadius: 8, padding: '12px' }}><DonutChart data={marketStats.status} theme={theme} customColors={{ "Full": C.purple, "Empty": "#3D556E" }} label="Total" /></div></div>
          {sec(C.cyan, "Container Size Distribution")}
          <div style={{ padding: '0 10px 8px' }}><div style={{ background: 'var(--bg2)', border: '1px solid var(--br2)', borderRadius: 8, padding: '12px' }}><DonutChart data={marketStats.size} theme={theme} label="Size" /></div></div>
        </>}
        {nav === "config" && <>
          <KpiStrip items={[{ lbl: "API", val: "OK", ic: C.green, icon: "✓", dl: "Healthy", dlt: "pos", spark: [1, 1, 1, 1, 1, 1, 1, 1] }, { lbl: "KPI Target", val: kt, unit: "M/h", ic: C.blue, icon: "🎯", dl: "target", dlt: "neu", spark: Array(8).fill(kt) }, { lbl: "Records", val: `${vessels.length}·${qcData.length}`, ic: C.purple, icon: "🗄", dl: "v·qc", dlt: "neu", spark: sp.v }, { lbl: "Last Load", val: new Date().toLocaleTimeString('en', { hour: '2-digit', minute: '2-digit' }), ic: C.cyan, icon: "⏱", dl: "success", dlt: "pos", spark: [1, 1, 1, 1, 1, 1, 1, 1] }]} />
        </>}

    /* ═══════════ App ═══════════════════════════════════════════════════════════ */
    function App() {
      const isMobile = useMobile();
      const getUrlParam = (key) => new URLSearchParams(window.location.search).get(key) || "";

      const [nav, setNavState] = useState(() => getUrlParam("tab") || "overview");
      const [col, setCol] = useState(false);
      const [notif, setNotif] = useState(false);
      const [uprof, setUprof] = useState(false);
      const [userName, setUserNameState] = useState(() => localStorage.getItem("tdr_user_name") || "Vân Trình");
      const [userRole, setUserRoleState] = useState(() => localStorage.getItem("tdr_user_role") || "System Admin");
      const [showSettings, setShowSettings] = useState(false);

      const setUserName = (v) => { setUserNameState(v); localStorage.setItem("tdr_user_name", v); };
      const setUserRole = (v) => { setUserRoleState(v); localStorage.setItem("tdr_user_role", v); };

      const userInitials = useMemo(() => {
        const parts = userName.split(" ");
        if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        return userName.slice(0, 2).toUpperCase();
      }, [userName]);

      const [feed, setFeed] = useState(false);
      const [opTab, setOpTab] = useState("MTD");
      const [qcPg, setQcPg] = useState(0);
      const [selectedCrane, setSelectedCrane] = useState("ALL");
      const [craneGroupBy, setCraneGroupBy] = useState("day");
      const [logFilter, setLogFilter] = useState("ALL");
      const [apiData, setApiData] = useState(null);
      const [apiLoading, setApiLoading] = useState(true);
      const [apiError, setApiError] = useState(null);

      const [fDateFrom, setFDateFromState] = useState(() => getUrlParam("from") || "");
      const [fDateTo, setFDateToState] = useState(() => getUrlParam("to") || "");
      const [fOp, setFOpState] = useState(() => getUrlParam("op") || "");
      const [fBerth, setFBerthState] = useState(() => getUrlParam("berth") || "");
      const [fVessel, setFVesselState] = useState(() => getUrlParam("vessel") || "");

      const setNav = (v) => { setNavState(v); setQcPg(0); };
      const setFDateFrom = (v) => { setFDateFromState(v); setQcPg(0); };
      const setFDateTo = (v) => { setFDateToState(v); setQcPg(0); };
      const setFOp = (v) => { setFOpState(v); setQcPg(0); };
      const setFBerth = (v) => { setFBerthState(v); setQcPg(0); };
      const setFVessel = (v) => { setFVesselState(v); setQcPg(0); };

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        if (nav && nav !== "overview") params.set("tab", nav); else params.delete("tab");
        if (fDateFrom) params.set("from", fDateFrom); else params.delete("from");
        if (fDateTo) params.set("to", fDateTo); else params.delete("to");
        if (fOp) params.set("op", fOp); else params.delete("op");
        if (fBerth) params.set("berth", fBerth); else params.delete("berth");
        if (fVessel) params.set("vessel", fVessel); else params.delete("vessel");
        params.delete("token");

        const newQuery = params.toString();
        const newUrl = window.location.pathname + (newQuery ? "?" + newQuery : "");
        window.history.replaceState({}, document.title, newUrl);
      }, [nav, fDateFrom, fDateTo, fOp, fBerth, fVessel]);

      const [filtOpen, setFiltOpen] = useState(true);
      const [theme, setTheme] = useState(() => localStorage.getItem("tdr_theme") || "dark");
      useEffect(() => {
        document.documentElement.setAttribute("data-theme", theme);
        localStorage.setItem("tdr_theme", theme);
      }, [theme]);

      // Persistent Custom KPI Target
      const [customKt, setCustomKtState] = useState(() => {
        const saved = localStorage.getItem("tdr_kpi_target");
        return saved ? parseInt(saved, 10) : null;
      });
      const setCustomKt = (val) => {
        setCustomKtState(val);
        if (val !== null) {
          localStorage.setItem("tdr_kpi_target", val);
        } else {
          localStorage.removeItem("tdr_kpi_target");
        }
      };

      const getApiToken = useCallback(() => {
        const params = new URLSearchParams(window.location.search);
        const urlToken = params.get("token");
        if (urlToken) {
          localStorage.setItem("tdr_api_token", urlToken);
          params.delete("token");
          const newQuery = params.toString();
          const newUrl = window.location.pathname + (newQuery ? "?" + newQuery : "");
          window.history.replaceState({}, document.title, newUrl);
          return urlToken;
        }
        return localStorage.getItem("tdr_api_token") || "";
      }, []);

      // silent=true → background refresh (no loading flash); silent=false → initial load
      const reloadData = useCallback((silent = false) => {
        if (!silent) { setApiLoading(true); setApiError(null); }
        const token = getApiToken();
        fetch("/api/data", {
          headers: {
            "X-API-Token": token
          }
        })
          .then(r => {
            if (r.status === 401) {
              localStorage.removeItem("tdr_api_token");
              throw new Error("UNAUTHORIZED");
            }
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.json();
          })
          .then(d => { setApiData(d); if (!silent) setApiLoading(false); })
          .catch(e => {
            if (!silent || String(e).includes("UNAUTHORIZED")) {
              setApiError(String(e));
              setApiLoading(false);
            }
          });
      }, [getApiToken]);

      // Auto-refresh every 30s — silent mode (no loading flash)
      useEffect(() => {
        const interval = setInterval(() => {
          if (!apiLoading && apiError !== "Error: UNAUTHORIZED") {
            reloadData(true); // silent background refresh
          }
        }, 30000);
        return () => clearInterval(interval);
      }, [reloadData, apiLoading, apiError]);

      useEffect(() => {
        reloadData();
      }, [reloadData]);

      // Sprint 2-6: Client-side CSV export logic
      const exportToCSV = useCallback((data, filename) => {
        if (!data || data.length === 0) return;
        const headers = Object.keys(data[0]);
        const csvRows = [headers.join(",")];
        for (const row of data) {
          const values = headers.map(header => {
            let val = row[header];
            if (val === null || val === undefined) val = '';
            const escaped = ('' + val).replace(/"/g, '""');
            return `"${escaped}"`;
          });
          csvRows.push(values.join(","));
        }
        const blob = new Blob([csvRows.join("\r\n")], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `${filename}_${new Date().toISOString().slice(0, 10)}.csv`);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }, []);

      const allDates = useMemo(() => {
        const dates = new Set();
        if (apiData?.meta?.reportDate) dates.add(apiData.meta.reportDate);
        (apiData?.vessels ?? []).forEach(v => {
          if (v.ata) { const d = v.ata.split(" ")[0]; if (/^\d{4}-\d{2}-\d{2}$/.test(d)) dates.add(d); }
        });
        return Array.from(dates).sort();
      }, [apiData]);
      const dateMin = allDates[0] || ""; const dateMax = allDates[allDates.length - 1] || "";

      const allOps = useMemo(() => {
        const ops = new Set();
        (apiData?.vessels ?? []).forEach(v => { if (v.op) ops.add(v.op); });
        return Array.from(ops).sort();
      }, [apiData]);

      const allBerths = useMemo(() => {
        const bs = new Set();
        (apiData?.vessels ?? []).forEach(v => { if (v.berth) bs.add(v.berth); });
        (apiData?.berths ?? []).forEach(b => { if (b.id) bs.add(b.id); });
        return Array.from(bs).sort();
      }, [apiData]);

      const allVessels = useMemo(() => {
        const vs = new Set();
        (apiData?.vessels ?? []).forEach(v => { if (v.name) vs.add(v.name); });
        return Array.from(vs).sort();
      }, [apiData]);

      const vessels = useMemo(() => {
        let res = apiData?.vessels ?? [];
        if (fDateFrom || fDateTo) res = res.filter(v => {
          if (!v.ata) return false;
          const d = v.ata.split(" ")[0];
          if (fDateFrom && d < fDateFrom) return false;
          if (fDateTo && d > fDateTo) return false;
          return true;
        });
        if (fOp) res = res.filter(v => v.op === fOp);
        if (fBerth) res = res.filter(v => v.berth === fBerth);
        if (fVessel) res = res.filter(v => v.name === fVessel);
        return res;
      }, [apiData, fDateFrom, fDateTo, fOp, fBerth, fVessel]);

      const delays = useMemo(() => {
        let res = apiData?.delays ?? [];
        const activeVesselNames = new Set(vessels.map(v => v.name));
        res = res.filter(d => activeVesselNames.has(d.vessel));
        if (fBerth) {
          res = res.filter(d => {
            const v = vessels.find(x => x.name === d.vessel);
            return v && v.berth === fBerth;
          });
        }
        return res;
      }, [apiData, vessels, fBerth]);

      const qcData = useMemo(() => {
        let res = apiData?.qc ?? [];
        const activeVesselNames = new Set(vessels.map(v => v.name));
        res = res.filter(q => activeVesselNames.has(q.vessel));
        return res;
      }, [apiData, vessels]);

      const qcTimeline = useMemo(() => {
        let res = apiData?.qcTimeline ?? [];
        const activeVesselNames = new Set(vessels.map(v => v.name));
        res = res.map(row => {
          const segs = row.segs.filter(seg => activeVesselNames.has(seg.v));
          return { ...row, segs };
        }).filter(row => row.segs.length > 0);
        return res;
      }, [apiData, vessels]);

      const berthStatus = useMemo(() => {
        let res = apiData?.berths ?? [];
        const activeVesselNames = new Set(vessels.map(v => v.name));
        return res.map(b => {
          if (b.vessel && !activeVesselNames.has(b.vessel)) {
            return { ...b, vessel: null, op: null, cranes: 0, pct: 0, conts: 0, atb: null, status: "Available" };
          }
          return b;
        });
      }, [apiData, vessels]);

      // --- Granular Market & Container Analysis Filtering ---
      const marketData = useMemo(() => {
        let res = apiData?.market ?? [];
        if (fDateFrom || fDateTo) res = res.filter(m => {
          if (!m["Report Date"]) return false;
          if (fDateFrom && m["Report Date"] < fDateFrom) return false;
          if (fDateTo && m["Report Date"] > fDateTo) return false;
          return true;
        });
        if (fOp) res = res.filter(m => m["Operator"] === fOp);
        if (fVessel) res = res.filter(m => m["Vessel Name"] === fVessel);
        return res;
      }, [apiData, fDateFrom, fDateTo, fOp, fVessel]);

      const marketStats = useMemo(() => {
        if (!marketData.length) return { cargo: {}, status: {}, size: {}, trends: [], byOp: [], byVessel: [] };
        const cargo = {}; const status = { Full: 0, Empty: 0 }; const size = { "20'": 0, "40'": 0, "45'": 0 };
        const trendsRaw = {}; const ops = {}; const vsls = {};

        marketData.forEach(m => {
          const opType = m.OperationType || "Unknown";
          const op = m.Operator || "Unknown";
          const v = m["Vessel Name"] || "Unknown";
          const total = m["Total Conts"] || 0;
          const full = m.Full || 0; const empty = m.Empty || 0;
          const s20 = m.s20 || 0; const s40 = m.s40 || 0; const s45 = m.s45 || 0;

          cargo[opType] = (cargo[opType] || 0) + total;
          status.Full += full; status.Empty += empty;
          size["20'"] += s20; size["40'"] += s40; size["45'"] += s45;

          // Operator summary
          if (!ops[op]) ops[op] = { op, total: 0, dis: 0, load: 0, full: 0, empty: 0, s20: 0, s40: 0, s45: 0 };
          ops[op].total += total; ops[op].full += full; ops[op].empty += empty;
          ops[op].s20 += s20; ops[op].s40 += s40; ops[op].s45 += s45;
          if (opType === "Discharge") ops[op].dis += total; else if (opType === "Load" || opType === "Loading") ops[op].load += total;

          // Vessel summary
          if (!vsls[v]) vsls[v] = { v, total: 0, dis: 0, load: 0, full: 0, empty: 0, s20: 0, s40: 0, s45: 0 };
          vsls[v].total += total; vsls[v].full += full; vsls[v].empty += empty;
          vsls[v].s20 += s20; vsls[v].s40 += s40; vsls[v].s45 += s45;
          if (opType === "Discharge") vsls[v].dis += total; else if (opType === "Load" || opType === "Loading") vsls[v].load += total;

          const dt = m["Report Date"];
          if (dt) trendsRaw[dt] = (trendsRaw[dt] || 0) + total;
        });

        const trends = Object.entries(trendsRaw).sort(([a], [b]) => a.localeCompare(b)).map(([date, volume]) => ({ date, volume })).slice(-12);
        const byOp = Object.values(ops).sort((a, b) => b.total - a.total);
        const byVessel = Object.values(vsls).sort((a, b) => b.total - a.total);

        return { cargo, status, size, trends, byOp, byVessel };
      }, [marketData]);

      const operators = apiData?.operators ?? [];
      const sp = apiData?.spark ?? SP0;
      const feedLines = apiData?.feed ?? [];
      const kt = customKt !== null ? customKt : (apiData?.meta?.kpiTarget ?? 45);
      const reportDate = apiData?.meta?.reportDate ?? "";
      const dbStatus = apiData?.meta?.dbStatus ?? "unknown";
      const metaVer = apiData?.meta?.version ?? "v1.0.0";
      KPI_TARGET = kt;

      const kpi = useMemo(() => {
        const tvs = vessels.length || 0;
        if (tvs === 0) return { tvs: 0, tteus: 0, avgPs: 0, avgNet: 0, avgNmph: 0, tdHrs: 0, avgDly: 0, above: 0, tcPct: 0, reportDate, spark: sp };
        const tteus = vessels.reduce((s, v) => s + (v.teus || 0), 0);
        const comp = vessels.filter(v => v.portstay);
        const avgPs = comp.length ? comp.reduce((s, v) => s + (v.portstay || 0), 0) / comp.length : 0;
        const avgNet = vessels.reduce((s, v) => s + (v.net || 0), 0) / tvs;
        const avgNmph = vessels.reduce((s, v) => s + (v.nmph || 0), 0) / tvs;
        const tdHrs = delays.reduce((s, d) => s + (d.dur || 0), 0);
        const avgDly = tvs ? tdHrs / tvs : 0;
        const above = vessels.filter(v => (v.nmph || 0) >= kt).length;
        const termHrs = delays.filter(d => d.type === "Terminal Convenience").reduce((s, d) => s + (d.dur || 0), 0);
        const tcPct = tdHrs > 0 ? Math.round(termHrs / tdHrs * 100) : 0;
        return { tvs, tteus, avgPs, avgNet, avgNmph, tdHrs, avgDly, above, tcPct, reportDate, spark: sp };
      }, [vessels, delays, kt, sp, reportDate]);

      const activeFiltersCount = ((fDateFrom || fDateTo) ? 1 : 0) + (fOp ? 1 : 0) + (fBerth ? 1 : 0) + (fVessel ? 1 : 0);
      const moveDelta = kpi.avgNmph - kt;
      const NOTIFS = vessels.filter(v => (v.nmph || 0) < kt).slice(0, 5).map(v => ({ t: `KPI Alert — ${v.name}`, s: `Net M/h: ${(v.nmph || 0).toFixed(1)} vs target ${kt}`, c: (v.nmph || 0) < kt - 1 ? C.red : C.amber }));

      /* Delay tab: per-vessel summary */
      const vesselDelayMap = useMemo(() => {
        const m = {};
        delays.forEach(d => {
          if (!m[d.vessel]) m[d.vessel] = { vessel: d.vessel, total: 0, terminal: 0, nonTerminal: 0, force: 0, events: 0, critical: 0 };
          const r = m[d.vessel];
          r.total += d.dur; r.events++;
          if (d.dur >= 1) r.critical++;
          if (d.type === "Terminal Convenience") r.terminal += d.dur;
          else if (d.type === "Non-Terminal Convenience") r.nonTerminal += d.dur;
          else r.force += d.dur;
        });
        return Object.values(m).sort((a, b) => b.total - a.total);
      }, [delays]);

      /* Crane tab: Gross/Net grouped by date period */
      const filteredQc = useMemo(() => selectedCrane === "ALL" ? qcData : qcData.filter(q => q.qc === selectedCrane), [qcData, selectedCrane]);
      const groupedChartData = useMemo(() => {
        const buckets = {};
        filteredQc.forEach(q => {
          const matchV = vessels.find(v => v.name === q.vessel);
          const ataRaw = matchV?.ata || "";
          let dateStr = ataRaw.split(" ")[0] || "";
          if (!dateStr.includes("-")) {
            dateStr = reportDate.split(" ")[0] || "";
          }
          if (!dateStr) return;
          let key = dateStr;
          if (craneGroupBy === "week") {
            const d = new Date(dateStr); const day = d.getDay(); const mon = new Date(d); mon.setDate(d.getDate() - day + 1);
            key = "W/" + mon.toISOString().slice(0, 10);
          } else if (craneGroupBy === "month") {
            key = dateStr.slice(0, 7);
          } else if (craneGroupBy === "quarter") {
            const m = parseInt(dateStr.slice(5, 7)); key = dateStr.slice(0, 4) + "-Q" + Math.ceil(m / 3);
          }
          if (!buckets[key]) buckets[key] = { gmhS: 0, nmhS: 0, cnt: 0 };
          buckets[key].gmhS += q.gmh; buckets[key].nmhS += q.nmh; buckets[key].cnt++;
        });
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        return Object.entries(buckets).sort(([a], [b]) => a.localeCompare(b)).map(([k, v]) => {
          let displayLabel = k;
          try {
            if (craneGroupBy === "day") {
              const p = k.split("-");
              if (p.length === 3) displayLabel = `${p[2]} ${months[parseInt(p[1]) - 1]} ${p[0]}`;
            } else if (craneGroupBy === "week") {
              const dateStr = k.replace("W/", "");
              const p = dateStr.split("-");
              if (p.length === 3) displayLabel = `Wk of ${p[2]} ${months[parseInt(p[1]) - 1]} ${p[0]}`;
            } else if (craneGroupBy === "month") {
              const p = k.split("-");
              if (p.length === 2) displayLabel = `${months[parseInt(p[1]) - 1]} ${p[0]}`;
            } else if (craneGroupBy === "quarter") {
              const p = k.split("-Q");
              if (p.length === 2) displayLabel = `Q${p[1]} ${p[0]}`;
            }
          } catch (e) {
            displayLabel = k;
          }
          return {
            lbl: displayLabel, gmh: v.cnt ? v.gmhS / v.cnt : 0, nmh: v.cnt ? v.nmhS / v.cnt : 0
          };
        });
      }, [filteredQc, craneGroupBy, vessels]);

      const qcOpData = useMemo(() => {
        let res = apiData?.qcOperator ?? [];
        const activeVesselNames = new Set(vessels.map(v => v.name));
        res = res.filter(q => activeVesselNames.has(q.vessel));
        return res;
      }, [apiData, vessels]);

      const filteredQcOp = useMemo(() => {
        return selectedCrane === "ALL" ? qcOpData : qcOpData.filter(q => q.qc === selectedCrane);
      }, [qcOpData, selectedCrane]);

      const groupedChartDataOp = useMemo(() => {
        const buckets = {};
        filteredQcOp.forEach(q => {
          const matchV = vessels.find(v => v.name === q.vessel);
          const ataRaw = matchV?.ata || "";
          let dateStr = ataRaw.split(" ")[0] || "";
          if (!dateStr.includes("-")) {
            dateStr = reportDate.split(" ")[0] || "";
          }
          if (!dateStr) return;
          let key = dateStr;
          if (craneGroupBy === "week") {
            const d = new Date(dateStr); const day = d.getDay(); const mon = new Date(d); mon.setDate(d.getDate() - day + 1);
            key = "W/" + mon.toISOString().slice(0, 10);
          } else if (craneGroupBy === "month") {
            key = dateStr.slice(0, 7);
          } else if (craneGroupBy === "quarter") {
            const m = parseInt(dateStr.slice(5, 7)); key = dateStr.slice(0, 4) + "-Q" + Math.ceil(m / 3);
          }
          if (!buckets[key]) buckets[key] = { gmhS: 0, nmhS: 0, cnt: 0 };
          buckets[key].gmhS += q.gmh; buckets[key].nmhS += q.nmh; buckets[key].cnt++;
        });
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        return Object.entries(buckets).sort(([a], [b]) => a.localeCompare(b)).map(([k, v]) => {
          let displayLabel = k;
          try {
            if (craneGroupBy === "day") {
              const p = k.split("-");
              if (p.length === 3) displayLabel = `${p[2]} ${months[parseInt(p[1]) - 1]} ${p[0]}`;
            } else if (craneGroupBy === "week") {
              const dateStr = k.replace("W/", "");
              const p = dateStr.split("-");
              if (p.length === 3) displayLabel = `Wk of ${p[2]} ${months[parseInt(p[1]) - 1]} ${p[0]}`;
            } else if (craneGroupBy === "month") {
              const p = k.split("-");
              if (p.length === 2) displayLabel = `${months[parseInt(p[1]) - 1]} ${p[0]}`;
            } else if (craneGroupBy === "quarter") {
              const p = k.split("-Q");
              if (p.length === 2) displayLabel = `Q${p[1]} ${p[0]}`;
            }
          } catch (e) {
            displayLabel = k;
          }
          return {
            lbl: displayLabel, gmh: v.cnt ? v.gmhS / v.cnt : 0, nmh: v.cnt ? v.nmhS / v.cnt : 0
          };
        });
      }, [filteredQcOp, craneGroupBy, vessels]);

      const getHeaderSubtitle = () => {
        if (!apiData) return "Loading...";
        const activeCranesCount = new Set(filteredQcOp.map(q => q.qc)).size;
        const critCount = delays.filter(d => d.dur >= 1).length;
        const belowKpiCount = vessels.filter(v => (v.nmph || 0) < kt).length;

        switch (nav) {
          case "overview":
            return `${reportDate || "—"} · ${vessels.length} vessels · ${kpi.above}/${kpi.tvs} above KPI`;
          case "vessels":
            return `${vessels.length} vessels · ${vessels.filter(v => v.st === "Berthed").length} berthed · ${vessels.filter(v => v.st === "Completed").length} completed · ${belowKpiCount} below KPI`;
          case "cranes":
            return `${filteredQc.length} records · ${qcTimeline.length} active cranes`;
          case "operators":
            return `${filteredQcOp.length} records · ${activeCranesCount} cranes · Adjusted Net M/h`;
          case "delays":
            return `${delays.length} events · ${new Set(delays.map(d => d.vessel)).size} vessels · ${critCount} critical (≥1h)`;
          case "config":
            return `Flask ${metaVer} · SQLite · ${dbStatus}`;
          default:
            return `${reportDate || "—"} · ${vessels.length} vessels`;
        }
      };

      if (apiLoading) return (
        <div style={{ height: "100vh", display: "flex", flexDirection: "column", overflow: "hidden", background: "var(--bg0)" }}>
          <header className="hdr">
            <div className="logo" style={{ background: "white", padding: "2px" }}>
              <img src="assets/csg-logo.jpg" alt="CSG" style={{ width: "100%", height: "100%", objectFit: "contain", display: "block", borderRadius: "4px" }}
                onError={e => {
                  e.target.style.display = 'none';
                  e.target.parentElement.style.background = 'linear-gradient(135deg, #3B82F6, #0EA5E9)';
                  e.target.parentElement.style.padding = '0';
                  e.target.parentElement.innerHTML = 'TDR';
                }} />
            </div>
            <div className="hdr-t">
              <h2>TDR Processor</h2>
              <p>Connecting…</p>
            </div>
          </header>
          <div className="ld-wrap"><div className="ld-spin" /><div style={{ fontSize: 11 }}>Loading dashboard data…</div></div>
        </div>
      );

      if (apiError === "Error: UNAUTHORIZED") return (
        <div style={{ height: "100vh", display: "flex", flexDirection: "column", overflow: "hidden", background: "var(--bg0)", justifyContent: "center", alignItems: "center" }}>
          <header className="hdr" style={{ position: "absolute", top: 0, left: 0, right: 0 }}><div className="logo" style={{ background: "rgba(59,130,246,.2)", color: C.blue }}>🔑</div><div className="hdr-t"><h2>TDR Processor</h2><p>Authentication Required</p></div></header>
          <div className="card" style={{ width: 380, padding: 28, textAlign: "center", borderRadius: 12, boxShadow: "0 10px 30px rgba(0,0,0,.35)", border: "1px solid var(--br2)", background: "var(--bg1)", marginTop: 40 }}>
            <div style={{ fontSize: 28, marginBottom: 12 }}>🔒</div>
            <h2 style={{ color: "var(--t1)", fontSize: 18, fontWeight: 700, marginBottom: 8 }}>Enter Access Token</h2>
            <p style={{ color: "var(--t3)", fontSize: 11.5, lineHeight: "1.5", marginBottom: 20 }}>This dashboard is secured. Enter your TDR API Access Token below to unlock real-time terminal metrics.</p>
            <div style={{ display: "flex", flexDirection: "column", gap: 12, alignItems: "stretch" }}>
              <input
                type="password"
                placeholder="API Access Token..."
                id="tokenInput"
                style={{
                  background: "var(--bg0)",
                  border: "1px solid var(--br2)",
                  padding: "10px 14px",
                  borderRadius: 8,
                  color: "var(--t1)",
                  fontSize: 13,
                  textAlign: "center",
                  outline: "none",
                  fontFamily: "var(--mono)"
                }}
                onKeyDown={e => {
                  if (e.key === "Enter") {
                    const val = e.target.value.trim();
                    if (val) {
                      localStorage.setItem("tdr_api_token", val);
                      reloadData();
                    }
                  }
                }}
              />
              <button
                className="btn bp"
                style={{ padding: "10px 14px", borderRadius: 8, fontWeight: 600 }}
                onClick={() => {
                  const val = document.getElementById("tokenInput").value.trim();
                  if (val) {
                    localStorage.setItem("tdr_api_token", val);
                    reloadData();
                  }
                }}
              >Verify & Unlock</button>
            </div>
          </div>
        </div>
      );

      if (apiError) return (
        <div style={{ height: "100vh", display: "flex", flexDirection: "column", overflow: "hidden", background: "var(--bg0)" }}>
          <header className="hdr"><div className="logo" style={{ background: "rgba(239,68,68,.2)", color: C.red }}>!</div><div className="hdr-t"><h2>Dashboard Error</h2><p>Cannot connect to Flask API</p></div></header>
          <div className="ld-wrap">
            <div style={{ fontSize: 13, color: C.red, fontWeight: 600 }}>⚠ {apiError}</div>
            <div style={{ fontSize: 11, color: "var(--t3)", marginTop: 4 }}>Make sure <span style={{ fontFamily: "var(--mono)", color: C.cyan }}>dashboard_api.py</span> is running on port 8503</div>
            <button className="btn bp" style={{ marginTop: 12 }} onClick={reloadData}>↺ Retry</button>
          </div>
        </div>
      );

      return (
        <div style={{ width: "100%", height: "100vh", display: "flex", overflow: "hidden", position: "relative" }}>
          {/* Sidebar */}
          {!isMobile && (<div className={`sb${col ? " col" : ""}`}>
            <div className="sb-head">
              <div className="logo" style={{ background: "white", padding: "2px" }}>
                <img src="assets/csg-logo.jpg" alt="CSG" style={{ width: "100%", height: "100%", objectFit: "contain", display: "block", borderRadius: "4px" }}
                  onError={e => {
                    e.target.style.display = 'none';
                    e.target.parentElement.style.background = 'linear-gradient(135deg, #3B82F6, #0EA5E9)';
                    e.target.parentElement.style.padding = '0';
                    e.target.parentElement.innerHTML = 'TDR';
                  }} />
              </div>
              {!col && <div className="sb-brand"><h1>TIEN-TAN THUAN PORT</h1><p>TDR Processor {metaVer}</p></div>}
            </div>
            <div className="sb-nav">
              <div className="nav-sec">{col ? "" : "MAIN"}</div>
              {NAV.map(n => (<div key={n.id} className={`nav-i${nav === n.id ? " act" : ""}`} onClick={() => setNav(n.id)}>
                <span className="ni">{n.icon}</span>
                {!col && <span className="nl">{n.lbl}</span>}
                {!col && n.id === "delays" && delays.length > 0 && <span className="nb">{delays.length}</span>}
              </div>))}
              {!col && <><div className="nav-sec">DATA</div>
                <div className="nav-i"><span className="ni">🗄</span><span className="nl">SQLite · {dbStatus === "healthy" ? "Connected" : "CSV Fallback"}</span></div>
                <div className="nav-i"><span className="ni">📂</span><span className="nl">{vessels.length} vessels · {qcData.length} QC</span></div></>}
            </div>
            {!col && (
              <div className="sb-filt">
                <div className="sb-filt-title" onClick={() => setFiltOpen(o => !o)}>
                  <span>🔍 FILTERS{activeFiltersCount > 0 ? ` (${activeFiltersCount})` : ""}</span>
                  {activeFiltersCount > 0 && <button className="sb-filt-clr" onClick={e => { e.stopPropagation(); setFDateFrom(""); setFDateTo(""); setFOp(""); setFBerth(""); setFVessel(""); }}>✕ Clear</button>}
                </div>
                {filtOpen && (
                  <div>
                    <div className="sb-filt-field" style={{ marginBottom: 8 }}>
                      <label className="sb-filt-lbl" style={{ display: 'block', marginBottom: 4 }}>📅 Date Range (ATB)</label>
                      <div style={{ display: 'flex', flexDirection: 'column', gap: 5 }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                          <span style={{ fontSize: 9, color: 'var(--t4)', width: 28, fontWeight: 600 }}>From</span>
                          <input type="date" className="sb-filt-inp" value={fDateFrom} min={dateMin} max={fDateTo || dateMax} onChange={e => setFDateFrom(e.target.value)} onClick={e => e.target.showPicker?.()} style={{ flex: 1, cursor: 'pointer', fontSize: 10.5, padding: '3px 6px', background: 'var(--bg3)', border: '1px solid var(--br2)', color: 'var(--t2)', borderRadius: 4, outline: 'none', height: 24, boxSizing: 'border-box' }} />
                        </div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                          <span style={{ fontSize: 9, color: 'var(--t4)', width: 28, fontWeight: 600 }}>To</span>
                          <input type="date" className="sb-filt-inp" value={fDateTo} min={fDateFrom || dateMin} max={dateMax} onChange={e => setFDateTo(e.target.value)} onClick={e => e.target.showPicker?.()} style={{ flex: 1, cursor: 'pointer', fontSize: 10.5, padding: '3px 6px', background: 'var(--bg3)', border: '1px solid var(--br2)', color: 'var(--t2)', borderRadius: 4, outline: 'none', height: 24, boxSizing: 'border-box' }} />
                        </div>
                      </div>
                    </div>
                    <div className="sb-filt-field">
                      <label className="sb-filt-lbl">🏢 Operator (Hãng tàu)</label>
                      <select className="sb-filt-inp" value={fOp} onChange={e => setFOp(e.target.value)}>
                        <option value="">All Operators</option>
                        {allOps.map(o => <option key={o} value={o}>{o}</option>)}
                      </select>
                    </div>
                    <div className="sb-filt-field">
                      <label className="sb-filt-lbl">⚓ Berth (Cầu bến)</label>
                      <select className="sb-filt-inp" value={fBerth} onChange={e => setFBerth(e.target.value)}>
                        <option value="">All Berths</option>
                        {allBerths.map(b => <option key={b} value={b}>{b}</option>)}
                      </select>
                    </div>
                    <div className="sb-filt-field">
                      <label className="sb-filt-lbl">🚢 Vessel (Tàu)</label>
                      <select className="sb-filt-inp" value={fVessel} onChange={e => setFVessel(e.target.value)}>
                        <option value="">All Vessels</option>
                        {allVessels.map(v => <option key={v} value={v}>{v}</option>)}
                      </select>
                    </div>
                  </div>
                )}
              </div>
            )}
            <div className="sb-foot">
              {!col && <div style={{ fontSize: 9.5, color: "var(--t4)" }}><span className="pulse" />API {dbStatus} · {reportDate || "—"}</div>}
            </div>
          </div>)}

          {/* Main */}
          <div className="main">
            <header className="hdr">
              {!isMobile && <button className="hdr-tog" onClick={() => setCol(c => !c)}>{col ? "→" : "←"}</button>}
              <div className="hdr-t">
                <h2>{PT[nav]}</h2>
                <p>{getHeaderSubtitle()}{activeFiltersCount > 0 ? ` · 🔍 ${activeFiltersCount} filter${activeFiltersCount > 1 ? "s" : ""} active` : ""}</p>
              </div>
              {!isMobile && (<div className="hdr-filt" style={{ display: "flex", alignItems: "center", gap: 6, background: "var(--bg3)", border: "1px solid var(--br2)", borderRadius: 6, padding: "2px 8px", cursor: "default" }}>
                <span style={{ fontSize: 11 }}>🎯 Target KPI:</span>
                <input type="number" value={kt} onChange={e => {
                  const v = parseInt(e.target.value, 10);
                  if (!isNaN(v) && v > 0) setCustomKt(v);
                }} style={{ width: 42, background: "var(--bg0)", border: "1px solid var(--br2)", color: "var(--t1)", fontSize: 11.5, textAlign: "center", borderRadius: 4, padding: "2px 0", outline: "none", fontWeight: 700, fontFamily: "inherit" }} />
                <span style={{ fontSize: 9.5, color: "var(--t4)" }}>M/h</span>
              </div>)}

              {/* Tab Specific Actions */}
              {!isMobile && (
