<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>TIEN-TAN THUAN PORT — TDR Processor</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --bg0: #080C15;
      --bg1: #0D1320;
      --bg2: #121A2B;
      --bg3: #172033;
      --bg4: #1E293B;
      --bg5: #243045;
      --br: #1A2438;
      --br2: #243048;
      --br3: #2E3E55;
      --t1: #E8EFF8;
      --t2: #8FA3BC;
      --t3: #5A748F;
      --t4: #3D556E;
      --blue: #3B82F6;
      --green: #10B981;
      --amber: #F59E0B;
      --red: #EF4444;
      --purple: #8B5CF6;
      --cyan: #06B6D4;
      --pink: #EC4899;
      --teal: #14B8A6;
      --orange: #F97316;
      --sw: 196px;
      --swc: 50px;
      --hh: 44px;
      --mono: 'JetBrains Mono', ui-monospace, monospace
    }

    [data-theme="light"] {
      --bg0: #F1F5F9;
      --bg1: #FFFFFF;
      --bg2: #FFFFFF;
      --bg3: #F8FAFC;
      --bg4: #E2E8F0;
      --bg5: #CBD5E1;
      --br: #E2E8F0;
      --br2: #E2E8F0;
      --br3: #CBD5E1;
      --t1: #0F172A;
      --t2: #334155;
      --t3: #475569;
      --t4: #64748B
    }

    html,
    body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--bg0);
      color: var(--t1);
      overflow: hidden;
      font-size: 12px;
      -webkit-font-smoothing: antialiased
    }

    #root {
      width: 100%;
      height: 100vh;
      overflow: hidden
    }

    ::-webkit-scrollbar {
      width: 3px;
      height: 3px
    }

    ::-webkit-scrollbar-track {
      background: transparent
    }

    ::-webkit-scrollbar-thumb {
      background: var(--br3);
      border-radius: 2px
    }

    .sb {
      width: var(--sw);
      background: var(--bg1);
      border-right: 1px solid var(--br);
      display: flex;
      flex-direction: column;
      transition: width .2s;
      flex-shrink: 0;
      overflow: hidden
    }

    .sb.col {
      width: var(--swc)
    }

    .sb-head {
      height: var(--hh);
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 9px;
      border-bottom: 1px solid var(--br);
      flex-shrink: 0
    }

    .sb-filt {
      padding: 8px 8px 4px;
      border-top: 1px solid var(--br);
      flex-shrink: 0
    }

    .sb-filt-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 4px 8px;
      cursor: pointer
    }

    .sb-filt-title span {
      font-size: 8.5px;
      font-weight: 600;
      letter-spacing: 1.2px;
      color: var(--t4);
      text-transform: uppercase
    }

    .sb-filt-clr {
      font-size: 9.5px;
      font-weight: 600;
      color: var(--amber);
      cursor: pointer;
      padding: 2px 5px;
      border-radius: 4px;
      background: rgba(245, 158, 11, .1);
      border: none;
      font-family: 'Inter', sans-serif
    }

    .sb-filt-clr:hover {
      background: rgba(245, 158, 11, .2)
    }

    .sb-filt-field {
      margin-bottom: 7px
    }

    .sb-filt-lbl {
      font-size: 9px;
      color: var(--t4);
      font-weight: 500;
      display: block;
      margin-bottom: 4px;
      letter-spacing: .4px
    }

    .sb-filt-inp {
      width: 100%;
      background: var(--bg0);
      border: 1px solid var(--br2);
      color: var(--t1);
      font-size: 10.5px;
      padding: 5px 7px;
      border-radius: 5px;
      outline: none;
      font-family: 'Inter', sans-serif;
      transition: border-color .12s
    }

    .sb-filt-inp:focus {
      border-color: var(--blue)
    }

    .sb-filt-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px
    }

    .logo {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: linear-gradient(135deg, #3B82F6, #0EA5E9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 10px;
      color: #fff;
      flex-shrink: 0
    }

    .sb-brand h1 {
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap
    }

    .sb-brand p {
      font-size: 9.5px;
      color: var(--t4);
      margin-top: 1px;
      white-space: nowrap
    }

    .sb-nav {
      flex: 1;
      padding: 8px 6px;
      overflow-y: auto
    }

    .nav-sec {
      font-size: 8.5px;
      font-weight: 600;
      letter-spacing: 1.2px;
      color: var(--t4);
      text-transform: uppercase;
      padding: 8px 7px 3px
    }

    .nav-i {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: all .12s;
      margin-bottom: 1px;
      white-space: nowrap;
      user-select: none
    }

    .nav-i:hover {
      background: rgba(59, 130, 246, .08)
    }

    .nav-i.act {
      background: rgba(59, 130, 246, .14);
      color: var(--blue)
    }

    .ni {
      font-size: 13px;
      flex-shrink: 0;
      width: 18px;
      text-align: center
    }

    .nl {
      font-size: 11.5px;
      font-weight: 500
    }

    .nb {
      margin-left: auto;
      background: var(--red);
      color: #fff;
      font-size: 8px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 8px
    }

    .sb-foot {
      padding: 10px 12px;
      border-top: 1px solid var(--br)
    }

    .pulse::before {
      content: '';
      display: inline-block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--green);
      margin-right: 6px;
      animation: p 2s infinite
    }

    @keyframes p {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .3
      }
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0
    }

    .hdr {
      height: var(--hh);
      background: var(--bg1);
      border-bottom: 1px solid var(--br);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      flex-shrink: 0
    }

    .hdr-tog {
      width: 26px;
      height: 26px;
      border-radius: 5px;
      background: transparent;
      border: 1px solid var(--br2);
      color: var(--t3);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all .12s;
      flex-shrink: 0;
      font-size: 10px
    }

    .hdr-tog:hover {
      background: var(--bg4);
      color: var(--t1)
    }

    .hdr-t {
      flex: 1;
      min-width: 0
    }

    .hdr-t h2 {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .hdr-t p {
      font-size: 9.5px;
      color: var(--t4);
      margin-top: 1px
    }

    .hdr-filt {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg3);
      border: 1px solid var(--br2);
      border-radius: 6px;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 11px;
      color: var(--t3);
      white-space: nowrap;
      flex-shrink: 0
    }

    .hdr-filt:hover {
      border-color: var(--blue);
      color: var(--t1)
    }

    .hdr-act {
      display: flex;
      align-items: center;
      gap: 6px
    }

    .ic-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: var(--bg3);
      border: 1px solid var(--br2);
      color: var(--t3);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all .12s;
      position: relative;
      font-size: 13px
    }

    .ic-btn:hover {
      background: var(--bg5);
      color: var(--t1)
    }

    .nd {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 6px;
      height: 6px;
      background: var(--red);
      border-radius: 50%;
      border: 1.5px solid var(--bg1)
    }

    .ava {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: linear-gradient(135deg, #3B82F6, #8B5CF6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      cursor: pointer
    }

    .cnt {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .cnt>* {
      flex-shrink: 0;
      min-height: 0
    }

    .ph {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      padding: 2px 0
    }

    .ph h1 {
      font-size: 15px;
      font-weight: 700
    }

    .ph p {
      font-size: 10px;
      color: var(--t4);
      margin-top: 2px
    }

    .ph-r {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all .12s;
      white-space: nowrap;
      font-family: 'Inter', sans-serif
    }

    .bp {
      background: var(--blue);
      color: #fff
    }

    .bp:hover {
      background: #2563EB
    }

    .bg {
      background: transparent;
      color: var(--t3);
      border: 1px solid var(--br2)
    }

    .bg:hover {
      background: var(--bg4);
      color: var(--t1)
    }

    .br2x {
      background: rgba(239, 68, 68, .1);
      color: var(--red);
      border: 1px solid rgba(239, 68, 68, .2)
    }

    .br2x:hover {
      background: rgba(239, 68, 68, .18)
    }

    .kg {
      display: grid;
      gap: 8px;
      flex-shrink: 0
    }

    .k6 {
      grid-template-columns: repeat(6, 1fr)
    }

    .k4 {
      grid-template-columns: repeat(4, 1fr)
    }

    .k3 {
      grid-template-columns: repeat(3, 1fr)
    }

    .kc {
      background: var(--bg2);
      border: 1px solid var(--br2);
      border-radius: 8px;
      padding: 10px 12px;
      cursor: default;
      transition: border-color .15s, transform .15s;
      position: relative;
      overflow: hidden
    }

    .kc::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px
    }

    .kc:hover {
      border-color: var(--blue);
      transform: translateY(-1px)
    }

    .kc-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 7px
    }

    .kc-lbl {
      font-size: 9px;
      font-weight: 500;
      color: var(--t4);
      text-transform: uppercase;
      letter-spacing: .8px;
      line-height: 1.3
    }

    .kc-ico {
      width: 23px;
      height: 23px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px
    }

    .kc-val {
      font-size: 21px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 7px;
      letter-spacing: -.5px
    }

    .kc-val span {
      font-size: 11px;
      font-weight: 400;
      color: var(--t4);
      margin-left: 1px
    }

    .kc-bot {
      display: flex;
      align-items: center;
      justify-content: space-between
    }

    .kc-dl {
      font-size: 9.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 2px
    }

    .pos {
      color: var(--green)
    }

    .neg {
      color: var(--red)
    }

    .neu {
      color: var(--t4)
    }

    .card {
      background: var(--bg1);
      border: 1px solid var(--br2);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      flex-shrink: 0;
      min-width: 0
    }

    .ch {
      padding: 9px 12px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--br);
      flex-shrink: 0
    }

    .ct {
      font-size: 11.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--t1)
    }

    .cdot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0
    }

    .cb {
      padding: 10px 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0
    }

    .g2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      flex-shrink: 0;
      min-height: 0
    }

    .g32 {
      display: grid;
      grid-template-columns: 3fr 2fr;
      gap: 8px;
      flex-shrink: 0;
      min-height: 0
    }

    .g23 {
      display: grid;
      grid-template-columns: 2fr 3fr;
      gap: 8px;
      flex-shrink: 0;
      min-height: 0
    }

    .gcol {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
      min-height: 0
    }

    .gcol>* {
      flex-shrink: 0;
      min-height: 0
    }

    .tabs {
      display: flex;
      gap: 2px;
      background: var(--bg4);
      border-radius: 6px;
      padding: 3px
    }

    .tab {
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 10.5px;
      font-weight: 500;
      color: var(--t3);
      cursor: pointer;
      transition: all .12s
    }

    .tab.ac {
      background: var(--bg2);
      color: var(--t1)
    }

    .bx {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 1px 7px;
      border-radius: 20px;
      font-size: 9.5px;
      font-weight: 600;
      white-space: nowrap
    }

    .bx::before {
      content: '';
      width: 4px;
      height: 4px;
      border-radius: 50%;
      flex-shrink: 0
    }

    .bg_ {
      background: rgba(16, 185, 129, .11);
      color: #10B981
    }

    .bg_::before {
      background: #10B981
    }

    .bb_ {
      background: rgba(59, 130, 246, .11);
      color: #3B82F6
    }

    .bb_::before {
      background: #3B82F6
    }

    .ba_ {
      background: rgba(245, 158, 11, .11);
      color: #F59E0B
    }

    .ba_::before {
      background: #F59E0B
    }

    .br_ {
      background: rgba(239, 68, 68, .11);
      color: #EF4444
    }

    .br_::before {
      background: #EF4444
    }

    .bp_ {
      background: rgba(139, 92, 246, .11);
      color: #8B5CF6
    }

    .bp_::before {
      background: #8B5CF6
    }

    .bc_ {
      background: rgba(6, 182, 212, .11);
      color: #06B6D4
    }

    .bc_::before {
      background: #06B6D4
    }

    .bs_ {
      background: rgba(90, 116, 143, .11);
      color: #5A748F
    }

    .bs_::before {
      background: #5A748F
    }

    .tw {
      overflow: auto;
      flex: 1;
      min-height: 0;
      min-width: 0
    }

    .tw table {
      border-collapse: separate;
      border-spacing: 0
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11.5px;
      letter-spacing: -0.1px
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 10px 12px;
      background: var(--bg2);
      color: var(--t4);
      font-weight: 700;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      text-align: left;
      white-space: nowrap;
      cursor: pointer;
      border-bottom: 2px solid var(--br2);
      user-select: none;
      transition: color .12s
    }

    thead th:hover {
      color: var(--t2)
    }

    thead th.sa::after {
      content: ' ↑';
      color: var(--blue)
    }

    thead th.sd::after {
      content: ' ↓';
      color: var(--blue)
    }

    tbody tr {
      border-bottom: 1px solid var(--br);
      transition: background-color .15s ease;
      background: var(--bg1)
    }

    tbody tr:hover {
      background-color: rgba(59, 130, 246, 0.04) !important
    }

    tbody tr:last-child {
      border-bottom: none
    }

    td {
      padding: 10px 12px;
      color: var(--t2);
      white-space: nowrap;
      vertical-align: middle
    }

    .tb {
      color: var(--t1);
      font-weight: 700
    }

    .tr {
      text-align: right
    }

    .tm {
      font-family: var(--mono);
      font-size: 10.5px
    }

    .kd {
      display: inline-flex;
      align-items: center;
      gap: 5px
    }

    .kd-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0
    }

    .pgr {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 7px 12px;
      border-top: 1px solid var(--br);
      flex-shrink: 0
    }

    .pgi {
      font-size: 10px;
      color: var(--t4);
      flex: 1
    }

    .pb {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      background: var(--bg3);
      border: 1px solid var(--br2);
      color: var(--t3);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 10px;
      transition: all .1s
    }

    .pb:hover {
      background: var(--bg5);
      color: var(--t1)
    }

    .pb.ac {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff
    }

    .pb:disabled {
      opacity: .3;
      cursor: default;
      pointer-events: none
    }

    .prg {
      height: 3px;
      background: var(--br2);
      border-radius: 2px;
      overflow: hidden
    }

    .prg-f {
      height: 100%;
      border-radius: 2px;
      transition: width .3s ease
    }

    .gnt-wrap {
      overflow-x: auto
    }

    .gnt-hdr {
      display: flex;
      align-items: center;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--br)
    }

    .gnt-lbl {
      flex-shrink: 0;
      font-size: 8.5px;
      font-weight: 600;
      letter-spacing: .8px;
      text-transform: uppercase;
      color: var(--t4)
    }

    .gnt-axis {
      flex: 1;
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      color: var(--t4);
      font-family: var(--mono)
    }

    .gnt-row {
      display: flex;
      align-items: center;
      padding: 4px 0;
      border-bottom: 1px solid rgba(20, 36, 56, .5)
    }

    .gnt-row:last-child {
      border-bottom: none
    }

    .gnt-rl {
      flex-shrink: 0;
      font-size: 10.5px;
      color: var(--t2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .gnt-trk {
      flex: 1;
      position: relative;
      height: 20px;
      background: rgba(8, 12, 21, .5);
      border-radius: 3px;
      overflow: hidden
    }

    .gnt-bar {
      position: absolute;
      top: 0;
      height: 100%;
      border-radius: 2px;
      display: flex;
      align-items: center;
      padding: 0 5px;
      font-size: 8.5px;
      font-weight: 600;
      color: rgba(255, 255, 255, .9);
      white-space: nowrap;
      overflow: hidden;
      cursor: pointer;
      opacity: .85;
      transition: opacity .12s
    }

    .gnt-bar:hover {
      opacity: 1;
      z-index: 2
    }

    .gnt-legs {
      display: flex;
      gap: 12px;
      padding-top: 8px;
      flex-wrap: wrap
    }

    .gnt-leg {
      display: flex;
