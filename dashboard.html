                                <th style={{ textAlign: "right" }}>Net Hours</th>
                                <th style={{ textAlign: "right" }}>Delay Hours</th>
                                <th style={{ textAlign: "right" }}>Total Moves</th>
                                <th style={{ textAlign: "right" }}>Avg Gross M/h</th>
                                <th style={{ textAlign: "right" }}>Avg Net M/h</th>
                              </tr>
                            </thead>

                              {(() => {
                                const m = {};
                                qcData.forEach(q => {
                                  if (!m[q.qc]) m[q.qc] = { qc: q.qc, vessels: new Set(), gH: 0, nH: 0, dH: 0, tot: 0 };
                                  const r = m[q.qc];
                                  r.vessels.add(q.vessel);
                                  r.gH += q.gH;
                                  r.nH += q.nH;
                                  r.dH += q.dH;
                                  r.tot += q.tot;
                                });
                                const summary = Object.values(m).map(r => ({
                                  ...r,
                                  vesselList: Array.from(r.vessels).join(", "),
                                  vesselsCount: r.vessels.size,
                                  gmh: r.gH > 0 ? r.tot / r.gH : 0,
                                  nmh: r.nH > 0 ? r.tot / r.nH : 0

                                return summary.map((r, i) => (
                                  <tr key={i}>
                                    <td className="tb"><span className="bx bc_" style={{ fontFamily: "var(--mono)" }}>{r.qc}</span></td>

                                    <td className="tr">{r.gmh.toFixed(1)}</td>

                        <div className="card">
                          <div className="ch"><div className="ct"><div className="cdot" style={{ background: C.green }} />System Status</div><span className="bx bg_">Healthy</span></div>
                          <div className="cb" style={{ padding: "4px 12px" }}>
                            {[["API Status", dbStatus === "healthy" ? "Healthy" : "CSV Fallback", dbStatus === "healthy" ? C.green : C.amber], ["Version", metaVer, "var(--t1)"], ["Database", dbStatus === "healthy" ? "SQLite connected" : "CSV fallback", dbStatus === "healthy" ? C.green : C.amber], ["KPI Target", `${kt} moves/h`, C.blue], ["Input Dir", "./data_input/", "var(--t2)"], ["Output Dir", "./outputs/", "var(--t2)"], ["Report Date", reportDate || "—", "var(--t2)"], ["Vessels", `${vessels.length} loaded`, "var(--t2)"], ["QC Records", `${qcData.length} loaded`, "var(--t2)"], ["Delay Events", `${delays.length} loaded`, delays.length > 0 ? C.amber : "var(--t2)"]].map(([k, v, c]) => (<div key={k} className="ms"><div className="ms-l">{k}</div><div style={{ fontSize: 11, fontWeight: 600, color: c, fontFamily: k.includes("Dir") ? "var(--mono)" : "inherit" }}>{v}</div></div>))}
                          </div>
                        </div>
                        <div className="card">
                          <div className="ch"><div className="ct"><div className="cdot" style={{ background: C.blue }} />REST API Endpoints</div></div>
                          <div className="cb" style={{ padding: "4px 12px" }}>
                            {[["GET", "/", "Dashboard HTML"], ["GET", "/api/meta", "Meta & config"], ["GET", "/api/data", "All dashboard data"], ["GET", "/api/vessels", "Vessel summary (legacy)"]].map(([m, ep, desc]) => (<div key={ep} className="ms"><div style={{ display: "flex", alignItems: "center", gap: 6 }}><span style={{ fontSize: 8, fontWeight: 700, padding: "1px 5px", borderRadius: 3, background: "rgba(16,185,129,.12)", color: C.green, fontFamily: "var(--mono)" }}>{m}</span><span style={{ fontFamily: "var(--mono)", fontSize: 10, color: C.cyan }}>{ep}</span></div><span style={{ fontSize: 9, color: "var(--t4)" }}>{desc}</span></div>))}
                          </div>
                        </div>
                      </div>
                      <div className="card" style={{ display: "flex", flexDirection: "column", minHeight: 0 }}>
                        <div className="ch">
                          <div className="ct"><div className="cdot" style={{ background: "var(--t4)" }} />System Log Viewer</div>
                          <div style={{ marginLeft: "auto", background: "var(--bg0)", border: "1px solid var(--br2)", padding: 2, borderRadius: 6, display: "flex", gap: 2 }}>
                            {["ALL", "INFO", "WARN", "ERROR"].map(lvl => {
                              const colors = {
                                ALL: { bg: "rgba(90,116,143,.15)", c: "#8FA3BC", b: "#5A748F" },
                                INFO: { bg: "rgba(59,130,246,.15)", c: "#3B82F6", b: "#3B82F6" },
                                WARN: { bg: "rgba(245,158,11,.15)", c: "#F59E0B", b: "#F59E0B" },
                                ERROR: { bg: "rgba(239,68,68,.15)", c: "#EF4444", b: "#EF4444" }
                              };
                              const active = logFilter === lvl;
                              const current = colors[lvl];
                              return (
                                <button key={lvl} onClick={() => setLogFilter(lvl)} style={{
                                  padding: "2px 8px",
                                  borderRadius: 4,
                                  fontSize: 9,
                                  fontWeight: 700,
                                  fontFamily: "'Inter', sans-serif",
                                  cursor: "pointer",
                                  border: active ? `1px solid ${current.b}` : "1px solid transparent",
                                  background: active ? current.bg : "transparent",
                                  color: active ? current.c : "#5A748F",
                                  transition: "all .12s",
                                  outline: "none"
                                }}>{lvl}</button>
                              );
                            })}
                          </div>
                        </div>
                        <div style={{ flex: 1, overflowY: "auto", background: "var(--bg0)", borderRadius: "0 0 7px 7px", padding: "8px 12px", fontFamily: "var(--mono)", minHeight: 0 }}>
                          {(logFilter === "ALL" ? feedLines : feedLines.filter(l => l.lv === logFilter)).map((l, i) => (<div key={i} className="feed-line"><span className="fl-t">{l.t}</span><span className="fl-lv" style={{ color: { INFO: C.blue, WARN: C.amber, ERROR: C.red, SUCCESS: C.green }[l.lv] || "var(--t3)" }}>[{l.lv}]</span><span className="fl-m">{l.m}</span></div>))}
                        </div>
                      </div>
                    </div>
                  </>)}

                </main>
                {isMobile
                  ? <MobileBottomNav nav={nav} setNav={setNav} delayCount={delays.length} />
                  : <SystemFeed open={feed} onToggle={() => setFeed(o => !o)} initLines={feedLines} />}
              </>}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>

</html>
